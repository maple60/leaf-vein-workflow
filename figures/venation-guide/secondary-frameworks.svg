<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc">
<title id="title">2次脈の行き先の比較</title><desc id="desc">葉の右半分を切り出した模式図。左から葉縁到達、葉縁到達と隣接脈への分岐、2次脈相当のループ、細くなり3次脈を介して接続する4つの型。上が葉の先端方向。</desc>
<style>text{font-family:'Yu Gothic',Meiryo,sans-serif;fill:#243841;text-anchor:middle;font-size:18px}.en{font-size:16px}.small{font-size:15px}.one{stroke:#176496;stroke-width:7}.two{stroke:#bc5b17;stroke-width:5}.three{stroke:#328570;stroke-width:2}.edge{stroke:#84999f;stroke-width:2;stroke-dasharray:5 4}path,line{fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1040" height="400" rx="16" fill="#f6f9fa"/>
<text x="520" y="30" class="small">各パネルは葉の右半分の局所像。上＝先端側、左の青線＝1次脈、右の破線＝葉縁。</text>
<g transform="translate(0 0)"><text x="130" y="65">葉縁に達する</text><text x="130" y="92" class="en">Craspedodromous</text><path class="one" d="M40 135V330"/><path class="edge" d="M220 135V330"/><path class="two" d="M40 220Q130 180 220 150 M40 300Q130 260 220 230"/><text x="130" y="365" class="small">橙の脈が葉縁まで続く</text></g>
<g transform="translate(260 0)"><text x="130" y="65">葉縁側で分岐する</text><text x="130" y="92" class="en">Semicraspedodromous</text><path class="one" d="M40 135V330"/><path class="edge" d="M220 135V330"/><path class="two" d="M40 220Q130 180 220 150 M40 300Q130 260 220 230 M175 247Q200 190 175 166"/><text x="130" y="365" class="small">葉縁へ行く枝＋上隣への枝</text></g>
<g transform="translate(520 0)"><text x="130" y="65">太さを保ちループに</text><text x="130" y="92" class="en">Simple brochidodromous</text><path class="one" d="M40 135V330"/><path class="edge" d="M220 135V330"/><path class="two" d="M40 220Q120 175 175 160 M40 300Q120 255 175 240Q205 195 175 160 M175 160Q192 145 185 135"/><text x="130" y="365" class="small">2次脈の太さのループ</text></g>
<g transform="translate(780 0)"><text x="130" y="65">細くなってつながる</text><text x="130" y="92" class="en">Eucamptodromous</text><path class="one" d="M40 135V330"/><path class="edge" d="M220 135V330"/><path class="two" d="M40 220Q110 183 155 168 M40 300Q110 263 155 248"/><path d="M155 168Q175 160 180 147 M155 248Q175 240 180 227" stroke="#bc5b17" stroke-width="3"/><path class="three" d="M180 227Q187 200 163 166 M180 227L205 214L197 192L175 181 M205 214L214 180L197 162"/><text x="130" y="365" class="small">緑の3次脈を介して接続</text></g>
<text x="520" y="391" class="small">橙＝2次脈、緑＝3次脈。比較のため葉縁を直線化し、他の脈を省略。</text>
</svg>
